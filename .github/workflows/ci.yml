name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # matches Pyodide's Python
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - name: Precomputed JSON is up to date
        run: |
          python scripts/precompute.py
          git diff --exit-code -- web/public/precomputed
